; PlatformIO project configuration
; Projeto: Seguidor de Linha Competitivo - Arduino Nano (ATmega328P)
;
; Ambientes:
;   nanoatmega328new -> bootloader novo (default)
;   nanoatmega328old -> compatibilidade com bootloader antigo
;
; Frequencia: 16 MHz
; Tensao logica: 5 V
; Plataforma: Atmel AVR
; Framework: Arduino
;
; Para compilar:
;   pio run -e nanoatmega328new
;   pio run -e nanoatmega328old

[platformio]
default_envs = nanoatmega328new

[env:nanoatmega328new]
platform = atmelavr
board = nanoatmega328
framework = arduino
build_flags =
    -D ARDUINO_NANO
    -D CONFIG_MODE_DIAGNOSTIC_DEFAULT=0
    -O2
monitor_speed = 115200

[env:nanoatmega328old]
platform = atmelavr
board = nanoatmega328
framework = arduino
build_flags =
    -D ARDUINO_NANO
    -D CONFIG_MODE_DIAGNOSTIC_DEFAULT=0
    -O2
; Bootloader antigo: baud rate de 57600
monitor_speed = 57600